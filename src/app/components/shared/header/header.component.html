<header class="header" [class.menu-open]="isMenuOpen()">
  <div class="container header-container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img src="/assets/logo.webp" alt="AIRWOOD" class="logo-img">
      <span class="logo-byline">by Forte Srl</span>
    </a>
    
    <!-- Desktop and Mobile Navigation Menu -->
    <nav class="nav" [class.active]="isMenuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link" (click)="closeMenu()">{{ t().nav.home }}</a>
      <a routerLink="/prodotti" routerLinkActive="active" class="nav-link" (click)="closeMenu()">{{ t().nav.products }}</a>
      <a routerLink="/area-tecnica" routerLinkActive="active" class="nav-link" (click)="closeMenu()">{{ t().nav.technicalArea }}</a>
      <a routerLink="/certificazioni" routerLinkActive="active" class="nav-link" (click)="closeMenu()">{{ t().nav.certifications }}</a>
      <a routerLink="/cataloghi" routerLinkActive="active" class="nav-link" (click)="closeMenu()">{{ t().nav.catalogs }}</a>
      <a routerLink="/progetti" routerLinkActive="active" class="nav-link" (click)="closeMenu()">{{ t().nav.projects }}</a>
      <a routerLink="/chi-siamo" routerLinkActive="active" class="nav-link" (click)="closeMenu()">{{ t().nav.about }}</a>
    </nav>
    
    <div class="header-actions">
      <!-- Language Switcher -->
      <div class="lang-switcher">
        <button [class.active]="currentLang() === 'it'" (click)="setLanguage('it')" aria-label="Italiano">IT</button>
        <span class="lang-divider">|</span>
        <button [class.active]="currentLang() === 'en'" (click)="setLanguage('en')" aria-label="English">EN</button>
      </div>
      
      <a routerLink="/contatti" class="btn btn-primary nav-cta" (click)="closeMenu()">{{ t().nav.quoteCta }}</a>
      
      <!-- Hamburger Menu Button -->
      <button class="hamburger-btn" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-label="Toggle menu">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
      </button>
    </div>
  </div>
</header>
