<section id="map" class="section">
  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <div class="map-header">
      <span class="badge badge-wood">{{ t().map.badge }}</span>
      <h2 class="section-title">{{ t().map.title }}</h2>
    </div>
    
    <div class="map-wrapper">
      <iframe 
        src="https://maps.google.com/maps?q=Forte%20S.r.l.,%20Contrada%20Parco%20del%20Vecchio%20Bovio,%2070022%20Altamura%20(BA)&t=&z=16&ie=UTF8&iwloc=&output=embed" 
        width="100%" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade"
        title="Google Map location of Forte S.r.l."
      ></iframe>
    </div>
    
    <div class="map-footer">
      <a 
        href="https://www.google.com/maps/place/Forte+S.r.l.,+Contrada+Parco+del+Vecchio+Bovio,+70022+Altamura+BA,+Italy/@40.8167669,16.5307529,17z/" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="btn btn-outline"
      >
        <span class="btn-icon">🗺️</span>
        {{ t().map.viewLarge }}
      </a>
    </div>
  </div>
</section>
